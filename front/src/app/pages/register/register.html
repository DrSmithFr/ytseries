<app-page>
  <div class="register-container">
    <div class="signup-right">
      <mat-card>
        <a href="/">
          <img height="65" width="265" src="/assets/logo.png" alt="Logo">
        </a>
        <h1 class="mat-h1">
         Sign up
        </h1>

        <app-register-form></app-register-form>

      </mat-card>
      <p class="mt-2">You already have an account? <a class="primary" routerLink="/login">Please log in</a>.</p>
    </div>

    <div class="scroll-down hide-on-desktop">
      <mat-icon>expand_more</mat-icon>
    </div>

    <div class="signup-left">
      <iframe
        src="https://www.youtube.com/embed/hFerFs-mFTU?si=D7Uf3AU_k8UaAdTd"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
  </div>
</app-page>
