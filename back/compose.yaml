
services:
###> php-fpm ###
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: ytseries-php:8.4
    env_file: .env.docker
    working_dir: /var/www/back
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - composer_cache:/usr/local/composer
    # No "ports:": php-fpm (9000) stays internal, the nginx service joins it.
    healthcheck:
      # TCP check on the fpm port (no cgi-fcgi in the image).
      test: ["CMD-SHELL", "php -r 'exit(stream_socket_client(\"tcp://127.0.0.1:9000\") ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
###< php-fpm ###

###> symfony/messenger ###
  # Messenger consumer: same image as php, no port, no mount of its own
  # (the code comes from the bind mount declared in compose.override.yaml).
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ytseries-php:8.4
    command: ["php", "bin/console", "messenger:consume", "async",
              "--time-limit=3600", "--memory-limit=512M", "-vvv"]
    restart: unless-stopped
    env_file: .env.docker
    working_dir: /var/www/back
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_started
###< symfony/messenger ###

###> nginx ###
  nginx:
    image: nginx:1.29-alpine
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # php writes public/build, public/bundles, public/media/cache;
      # nginx only reads them.
      - ./public:/var/www/back/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
###< nginx ###

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-symfony}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_USER: ${POSTGRES_USER:-symfony}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-symfony}", "-U", "${POSTGRES_USER:-symfony}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data
###< doctrine/doctrine-bundle ###

###> symfony/redis-bundle ###
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data:rw
###< symfony/redis-bundle ###

###> ruflin/elastica ###
  elasticsearch:
    image: elasticsearch:8.19.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=ytseries
      - node.name=es01
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data:rw
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
###< ruflin/elastica ###

volumes:
###> php-fpm ###
  composer_cache:
###< php-fpm ###

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

###> symfony/redis-bundle ###
  redis_data:
###< symfony/redis-bundle ###

###> ruflin/elastica ###
  elasticsearch_data:
###< ruflin/elastica ###
