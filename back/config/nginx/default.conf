# nginx in front of the php-fpm container (service `php` of back/compose.yaml).
# Mounted read-only at /etc/nginx/conf.d/default.conf by back/compose.yaml.
#
# HTTP only: no certificate, no 443 listener. The CORS headers are produced by
# nelmio (back/.env: CORS_ALLOW_ORIGIN, back/config/packages/nelmio_cors.yaml):
# nginx must stay silent about them, otherwise the browser sees them twice.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/back/public;

    # Must stay >= post_max_size / upload_max_filesize (back/Dockerfile: 50M),
    # otherwise nginx answers 413 before PHP sees the upload.
    client_max_body_size 50M;

    # try to serve file directly, fallback to the front controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass php:9000;              # service `php` on the compose network
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param SERVER_NAME     $server_name;
        # long imports / indexation run over HTTP too
        fastcgi_read_timeout 300s;
        # forbids /index.php/some-path
        internal;
    }

    # no other php file is reachable
    location ~ \.php$ {
        return 404;
    }

    # compose healthcheck, answered by nginx itself (never touches php-fpm)
    location = /nginx-health {
        return 204;
    }

    # In the official image these paths are symlinks to stdout / stderr,
    # so `docker compose logs nginx` shows them.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
