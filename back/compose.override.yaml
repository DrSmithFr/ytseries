
services:
###> php-fpm ###
  php:
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # Set to 1 (or `make xdebug`) to start a debugging session
      XDEBUG_TRIGGER: "0"
      # Panther runs chromium as root inside the container: no sandbox.
      PANTHER_NO_SANDBOX: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/back
###< php-fpm ###

###> symfony/messenger ###
  worker:
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      XDEBUG_TRIGGER: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The code only comes from this mount in dev (the image holds no code).
      - ./:/var/www/back
###< symfony/messenger ###

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432:5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

###> symfony/redis-bundle ###
  redis:
    ports:
      - 6379:6379
###< symfony/redis-bundle ###

###> ruflin/elastica ###
  elasticsearch:
    ports:
      - 9200:9200
###< ruflin/elastica ###
